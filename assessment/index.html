<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales4Sight - Assessment Portal</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2980 0%, #26d0ce 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .portal-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .portal-header {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .portal-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .logo {
            max-width: 150px;
            margin: 0 auto 20px;
            display: block;
        }

        .portal-content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            margin-bottom: 10px;
            font-weight: 600;
            color: #444;
            font-size: 1.1rem;
            display: block;
        }

        .access-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 18px;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .access-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #dc2626;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .portal-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
<div class="portal-container">
    <div class="portal-header">
        <div class="logo">
            <h1 style="color: white; margin: 0;">Sales4Sight Inc.</h1>
        </div>
        <h1>Sales Assessment</h1>
        <p>Enter your access code to begin</p>
    </div>

    <div class="portal-content">

        <form id="accessForm">
            <div class="form-group">
                <label for="accessCode"><i class="fas fa-key"></i> Access Code</label>

                <input type="text"
                       id="accessCode"
                       class="access-input"
                       placeholder="Enter your 8-digit access code"
                       maxlength="8"
                       required
                       inputmode="verbatim"
                       autocorrect="off"
                       autocapitalize="characters"
                       autocomplete="one-time-code"
                       spellcheck="false">

                <div class="error-message" id="errorMessage">
                    Invalid access code.
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <i class="fas fa-play-circle"></i> Start Assessment
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Verifying access code...</p>
            </div>
        </form>

    </div>
</div>

<script>
/*===========================================
  SAFER LOCAL STORAGE WRAPPER
===========================================*/
function safeStorage() {
    try {
        const testKey = "__test__";
        localStorage.setItem(testKey, "1");
        localStorage.removeItem(testKey);
        return localStorage;
    } catch (e) {
        return null;
    }
}

const storage = safeStorage();

/*===========================================
  ACCESS CODES
===========================================*/
const ACTIVE_CODES = {
    "MSS2026A": { uses: 0, maxUses: 50, expires: "2026-03-30" },
    "S4S2026F": { uses: 0, maxUses: 15, expires: "2026-03-30" },
    "S4S2026C": { uses: 0, maxUses: 15, expires: "2026-04-30" },
    "TEST1234": { uses: 0, maxUses: 15, expires: "2026-03-30" }
};

if (storage) {
    const saved = storage.getItem("s4s_usage");
    if (saved) {
        const parsed = JSON.parse(saved);
        Object.keys(parsed).forEach(c => {
            if (ACTIVE_CODES[c]) ACTIVE_CODES[c].uses = parsed[c];
        });
    }
}

/*===========================================
  FORM VALIDATION
===========================================*/
document.getElementById("accessForm").addEventListener("submit", function (e) {
    e.preventDefault();
    validateAccessCode();
});

/* Enable Enter key on Android */
document.getElementById("accessCode").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        e.preventDefault();
        validateAccessCode();
    }
});

/* Clean input */
document.getElementById("accessCode").addEventListener("input", function () {
    let clean = this.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    this.value = clean.substring(0, 8);
    document.getElementById("errorMessage").classList.remove("show");
});

/*===========================================
  VALIDATE ACCESS CODE
===========================================*/
function validateAccessCode() {
    const code = document.getElementById("accessCode").value.trim();
    const submitBtn = document.getElementById("submitBtn");
    const loading = document.getElementById("loading");
    const errorMsg = document.getElementById("errorMessage");

    if (!code || !ACTIVE_CODES[code]) {
        showError("Invalid access code.");
        return;
    }

    const today = new Date();
    const expiry = new Date(ACTIVE_CODES[code].expires);

    if (today > expiry) {
        showError("This code has expired.");
        return;
    }

    if (ACTIVE_CODES[code].uses >= ACTIVE_CODES[code].maxUses) {
        showError("Usage limit reached.");
        return;
    }

    submitBtn.disabled = true;
    loading.style.display = "block";

    setTimeout(() => {
        grantAccess(code);
    }, 600);
}

function showError(msg) {
    const errorMsg = document.getElementById("errorMessage");
    const submitBtn = document.getElementById("submitBtn");
    const loading = document.getElementById("loading");

    errorMsg.textContent = msg;
    errorMsg.classList.add("show");

    loading.style.display = "none";
    submitBtn.disabled = false;
}

/*===========================================
  SUCCESS
===========================================*/
function grantAccess(code) {
    ACTIVE_CODES[code].uses++;

    if (storage) {
        const usage = {};
        Object.keys(ACTIVE_CODES).forEach(c => usage[c] = ACTIVE_CODES[c].uses);
        storage.setItem("s4s_usage", JSON.stringify(usage));
    }

    window.location.href = "New_T1.html?code=" + code;
}

/*===========================================
  ADMIN TRIPLE-CLICK
===========================================*/
let clicks = 0;
let lastClick = 0;

document.querySelector(".logo").addEventListener("click", () => {
    const now = Date.now();

    if (now - lastClick > 1000) clicks = 0;

    clicks++;
    lastClick = now;

    if (clicks === 3) {
        let pwd = "";
        try { pwd = prompt("Enter admin password:"); }
        catch {}

        if (pwd === "sales4sight_admin") {
            window.location.href = "admin/";
        }
        clicks = 0;
    }
});
</script>
</body>
</html>
