<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sales4Sight</title>
    <style>
        /* ADD ALL THE CSS FROM THE PREVIOUS ADMIN DASHBOARD HERE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI'; }
        body { background: #f5f7fa; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 30px; }
        /* ... rest of the CSS ... */
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- ==================== -->
    <!-- LOGIN SCREEN - SECURITY -->
    <!-- ==================== -->
    <div id="login-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 9999; display: flex; align-items: center; justify-content: center;">
        <div style="text-align: center; padding: 50px 40px; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 400px; width: 90%;">
            <div style="width: 80px; height: 80px; background: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px;">
                <i class="fas fa-lock" style="font-size: 2rem; color: white;"></i>
            </div>
            <h2 style="margin-bottom: 10px; color: #2563eb;">Admin Dashboard</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Sales4Sight Assessment Results</p>
            
            <input type="password" id="admin-password" placeholder="Enter admin password" 
                   style="width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; transition: all 0.3s;">
            
            <button onclick="checkPassword()" 
                    style="width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;">
                <i class="fas fa-sign-in-alt"></i> Access Dashboard
            </button>
            
            <p id="password-error" style="color: #ef4444; margin-top: 15px; display: none;">
                <i class="fas fa-exclamation-circle"></i> Incorrect password
            </p>
            
            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
                <p style="color: #94a3b8; font-size: 0.8rem;">
                    <i class="fas fa-shield-alt"></i> Secure Area • Authorized Personnel Only
                </p>
            </div>
        </div>
    </div>

    <!-- ==================== -->
    <!-- ADMIN DASHBOARD CONTENT -->
    <!-- ==================== -->
    <div id="admin-content" style="display: none;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0;">
                <h1 style="color: #2563eb;">
                    <i class="fas fa-chart-line"></i> Assessment Results Dashboard
                    <span style="font-size: 0.9rem; color: #64748b; margin-left: 10px;">Admin Panel</span>
                </h1>
                <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
            
            <!-- REST OF YOUR ADMIN DASHBOARD HTML GOES HERE -->
            <div class="stats" id="stats"></div>
            <div class="controls" id="controls"></div>
            <div id="results-table"></div>
        </div>
        
        <!-- Modal for details -->
        <div class="modal" id="detailModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Assessment Details</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <div id="modal-content"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== //
        // SECURITY SETTINGS    //
        // ==================== //
        const ADMIN_PASSWORD = "SCS3066*"; // CHANGE THIS!
        const SESSION_TIMEOUT = 30; // minutes
        
        // Check if already logged in
        const loginTime = localStorage.getItem('admin_login_time');
        const now = new Date().getTime();
        
        if (loginTime && (now - loginTime) < (SESSION_TIMEOUT * 60 * 1000)) {
            // Still in valid session
            showAdminContent();
        } else {
            // Show login screen
            document.getElementById('login-screen').style.display = 'flex';
            localStorage.removeItem('admin_login_time');
        }
        
        function checkPassword() {
            const input = document.getElementById('admin-password').value;
            const error = document.getElementById('password-error');
            
            if (input === ADMIN_PASSWORD) {
                // Successful login
                localStorage.setItem('admin_login_time', new Date().getTime());
                showAdminContent();
            } else {
                error.style.display = 'block';
                document.getElementById('admin-password').value = '';
                document.getElementById('admin-password').focus();
                
                // Shake animation for wrong password
                document.getElementById('admin-password').style.borderColor = '#ef4444';
                setTimeout(() => {
                    document.getElementById('admin-password').style.borderColor = '#e2e8f0';
                }, 500);
            }
        }
        
        function showAdminContent() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadAdminData();
        }
        
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('admin_login_time');
                window.location.reload();
            }
        }
        
        // Enter key support
        document.getElementById('admin-password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
        
        // Auto-logout after timeout
        setInterval(() => {
            const loginTime = localStorage.getItem('admin_login_time');
            if (loginTime && (new Date().getTime() - loginTime) > (SESSION_TIMEOUT * 60 * 1000)) {
                logout();
            }
        }, 60000); // Check every minute
        
        // ==================== //
        // ADMIN FUNCTIONALITY  //
        // ==================== //
        function loadAdminData() {
            // Load and display the assessment results
            const results = JSON.parse(localStorage.getItem('s4s_assessment_results') || '[]');
            
            // Build stats
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${results.length}</div>
                    <div class="stat-label">Total Assessments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${results.length > 0 ? Math.round(results.reduce((sum, r) => sum + r.score, 0) / results.length) : 0}%</div>
                    <div class="stat-label">Average Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${results.filter(r => r.score >= 80).length}</div>
                    <div class="stat-label">Excellent (80%+)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${results.filter(r => r.score >= 60 && r.score < 80).length}</div>
                    <div class="stat-label">Good (60-79%)</div>
                </div>
            `;
            
            // Build controls
            document.getElementById('controls').innerHTML = `
                <button onclick="loadResults()"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button onclick="exportToCSV()" class="secondary"><i class="fas fa-download"></i> Export CSV</button>
                <button onclick="exportToJSON()" class="secondary"><i class="fas fa-file-export"></i> Export JSON</button>
                <button onclick="clearAllData()" class="danger"><i class="fas fa-trash"></i> Clear All</button>
            `;
            
            // Build table
            if (results.length === 0) {
                document.getElementById('results-table').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>No Assessment Results Yet</h3>
                        <p>Assessment data will appear here as users complete tests.</p>
                    </div>
                `;
                return;
            }
            
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Experience</th>
                            <th>Score</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            results.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            results.forEach((result, index) => {
                const scoreClass = result.score >= 80 ? 'score-excellent' : 
                                 result.score >= 60 ? 'score-good' : 'score-poor';
                const experienceLabels = ['Entry', 'Mid', 'Senior'];
                
                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${result.name}</td>
                        <td>${result.email}</td>
                        <td>${experienceLabels[result.experience]}</td>
                        <td>
                            <span class="score-badge ${scoreClass}">
                                ${result.score}%
                            </span>
                        </td>
                        <td>${new Date(result.timestamp).toLocaleDateString()}</td>
                        <td>
                            <button onclick="viewDetails(${index})" style="padding: 5px 10px; font-size: 0.9rem;">
                                <i class="fas fa-eye"></i> View
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tableHTML += '</tbody></table>';
            document.getElementById('results-table').innerHTML = tableHTML;
        }
        
        // Add the rest of your admin functions here...
        // viewDetails(), exportToCSV(), exportToJSON(), clearAllData(), etc.
        
        // Initialize
        if (document.getElementById('admin-content').style.display === 'block') {
            loadAdminData();
        }
    </script>
</body>
</html>
