<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sales4Sight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f5f7fa;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #2563eb;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #1d4ed8;
        }
        
        button.secondary {
            background: #64748b;
        }
        
        button.danger {
            background: #ef4444;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: #f8fafc;
            padding: 12px 15px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            color: #475569;
            font-weight: 600;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        tr:hover {
            background: #f8fafc;
        }
        
        .score-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .score-excellent { background: #d1fae5; color: #065f46; }
        .score-good { background: #fef3c7; color: #92400e; }
        .score-poor { background: #fee2e2; color: #991b1b; }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #cbd5e1;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
        }
        
        .topic-score {
            display: inline-block;
            margin: 2px 5px;
            padding: 2px 8px;
            background: #e2e8f0;
            border-radius: 10px;
            font-size: 0.8rem;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-chart-line"></i> Assessment Results Dashboard</h1>
        
        <div class="stats" id="stats">
            <!-- Stats will be loaded here -->
        </div>
        
        <div class="controls">
            <button onclick="loadResults()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            <button onclick="exportToCSV()" class="secondary"><i class="fas fa-download"></i> Export CSV</button>
            <button onclick="exportToJSON()" class="secondary"><i class="fas fa-file-export"></i> Export JSON</button>
            <button onclick="clearAllData()" class="danger"><i class="fas fa-trash"></i> Clear All Data</button>
        </div>
        
        <div id="results-table">
            <!-- Results table will be loaded here -->
        </div>
    </div>
    
    <!-- Modal for detailed view -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Assessment Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-content">
                <!-- Detailed content will be loaded here -->
            </div>
        </div>
    </div>
    
    <script>
        // Load results on page load
        document.addEventListener('DOMContentLoaded', loadResults);
        
        function loadResults() {
            const results = JSON.parse(localStorage.getItem('s4s_assessment_results') || '[]');
            
            // Update statistics
            updateStats(results);
            
            // Update table
            updateTable(results);
        }
        
        function updateStats(results) {
            const statsDiv = document.getElementById('stats');
            
            if (results.length === 0) {
                statsDiv.innerHTML = '<div class="empty-state">No assessment data available</div>';
                return;
            }
            
            // Calculate statistics
            const totalAssessments = results.length;
            const avgScore = Math.round(results.reduce((sum, r) => sum + r.score, 0) / results.length);
            
            const experienceCounts = {
                entry: results.filter(r => r.experience === 0).length,
                mid: results.filter(r => r.experience === 1).length,
                senior: results.filter(r => r.experience === 2).length
            };
            
            const scoreDistribution = {
                excellent: results.filter(r => r.score >= 80).length,
                good: results.filter(r => r.score >= 60 && r.score < 80).length,
                poor: results.filter(r => r.score < 60).length
            };
            
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalAssessments}</div>
                    <div class="stat-label">Total Assessments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${avgScore}%</div>
                    <div class="stat-label">Average Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${scoreDistribution.excellent}</div>
                    <div class="stat-label">Excellent (80%+)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${scoreDistribution.good}</div>
                    <div class="stat-label">Good (60-79%)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${experienceCounts.entry}</div>
                    <div class="stat-label">Entry Level</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${experienceCounts.mid}</div>
                    <div class="stat-label">Mid Level</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${experienceCounts.senior}</div>
                    <div class="stat-label">Senior Level</div>
                </div>
            `;
        }
        
        function updateTable(results) {
            const tableDiv = document.getElementById('results-table');
            
            if (results.length === 0) {
                tableDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>No Assessment Results Yet</h3>
                        <p>Assessment data will appear here as users complete tests.</p>
                    </div>
                `;
                return;
            }
            
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Experience</th>
                            <th>Score</th>
                            <th>Points</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            // Sort by most recent first
            results.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            results.forEach((result, index) => {
                const scoreClass = result.score >= 80 ? 'score-excellent' : 
                                 result.score >= 60 ? 'score-good' : 'score-poor';
                const experienceLabels = ['Entry', 'Mid', 'Senior'];
                
                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${result.name}</td>
                        <td>${result.email}</td>
                        <td>${experienceLabels[result.experience]}</td>
                        <td>
                            <span class="score-badge ${scoreClass}">
                                ${result.score}%
                            </span>
                        </td>
                        <td>${result.totalScore}/${result.maxScore}</td>
                        <td>${new Date(result.timestamp).toLocaleDateString()}</td>
                        <td>
                            <button onclick="viewDetails(${index})" style="padding: 5px 10px; font-size: 0.9rem;">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <button onclick="downloadReport(${index})" style="padding: 5px 10px; font-size: 0.9rem;" class="secondary">
                                <i class="fas fa-download"></i> Report
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tableHTML += '</tbody></table>';
            tableDiv.innerHTML = tableHTML;
        }
        
        function viewDetails(index) {
            const results = JSON.parse(localStorage.getItem('s4s_assessment_results') || '[]');
            const result = results[index];
            
            if (!result) return;
            
            const experienceLabels = ['Entry Level (0-2 Years)', 'Mid Level (2-10 Years)', 'Senior Level (Above 10 Years)'];
            
            // Build topic scores HTML
            let topicsHTML = '';
            if (result.topics) {
                Object.entries(result.topics).forEach(([topic, data]) => {
                    const statusClass = data.status === 'strong' ? 'score-excellent' : 
                                      data.status === 'average' ? 'score-good' : 'score-poor';
                    topicsHTML += `
                        <div style="margin-bottom: 10px;">
                            <strong>${topic}:</strong>
                            <span class="score-badge ${statusClass}" style="margin-left: 10px;">
                                ${data.percentage}%
                            </span>
                            (${data.totalPoints}/${data.maxPoints} points)
                        </div>
                    `;
                });
            }
            
            document.getElementById('modal-title').textContent = `Assessment: ${result.name}`;
            document.getElementById('modal-content').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <h3>Candidate Information</h3>
                    <p><strong>Name:</strong> ${result.name}</p>
                    <p><strong>Email:</strong> ${result.email}</p>
                    <p><strong>Mobile:</strong> ${result.mobile}</p>
                    <p><strong>Experience Level:</strong> ${experienceLabels[result.experience]}</p>
                    <p><strong>Access Code:</strong> ${result.accessCode || 'N/A'}</p>
                    <p><strong>Assessment Date:</strong> ${new Date(result.timestamp).toLocaleString()}</p>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3>Performance Summary</h3>
                    <p><strong>Overall Score:</strong> ${result.score}%</p>
                    <p><strong>Points:</strong> ${result.totalScore}/${result.maxScore}</p>
                    <p><strong>Performance Level:</strong> 
                        <span class="score-badge ${result.score >= 80 ? 'score-excellent' : result.score >= 60 ? 'score-good' : 'score-poor'}">
                            ${result.score >= 80 ? 'Excellent' : result.score >= 60 ? 'Good' : 'Needs Improvement'}
                        </span>
                    </p>
                </div>
                
                ${topicsHTML ? `
                <div style="margin-bottom: 20px;">
                    <h3>Topic-wise Performance</h3>
                    ${topicsHTML}
                </div>
                ` : ''}
                
                <div style="margin-top: 20px;">
                    <button onclick="downloadReport(${index})">
                        <i class="fas fa-download"></i> Download Full Report
                    </button>
                </div>
            `;
            
            document.getElementById('detailModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }
        
        function downloadReport(index) {
            const results = JSON.parse(localStorage.getItem('s4s_assessment_results') || '[]');
            const result = results[index];
            
            if (!result) return;
            
            const experienceLabels = ['Entry Level (0-2 Years)', 'Mid Level (2-10 Years)', 'Senior Level (Above 10 Years)'];
            
            let report = `SALES4SIGHT ASSESSMENT REPORT - ADMIN\n`;
            report += `=========================================\n\n`;
            report += `Candidate Information:\n`;
            report += `- Name: ${result.name}\n`;
            report += `- Email: ${result.email}\n`;
            report += `- Mobile: ${result.mobile}\n`;
            report += `- Experience Level: ${experienceLabels[result.experience]}\n`;
            report += `- Access Code: ${result.accessCode || 'N/A'}\n`;
            report += `- Assessment Date: ${new Date(result.timestamp).toLocaleString()}\n\n`;
            
            report += `Performance Summary:\n`;
            report += `- Overall Score: ${result.score}%\n`;
            report += `- Points: ${result.totalScore}/${result.maxScore}\n`;
            report += `- Performance Level: ${result.score >= 80 ? 'Excellent' : result.score >= 60 ? 'Good' : 'Needs Improvement'}\n\n`;
            
            if (result.topics) {
                report += `Topic-wise Performance:\n`;
                report += `=======================\n`;
                Object.entries(result.topics).forEach(([topic, data]) => {
                    report += `${topic}: ${data.percentage}% (${data.totalPoints}/${data.maxPoints} points) - ${data.statusText}\n`;
                });
                report += `\n`;
            }
            
            const blob = new Blob([report], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Sales4Sight_Report_${result.name.replace(/\s+/g, '_')}_${new Date(result.timestamp).getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function exportToCSV() {
            const results = JSON.parse(localStorage.getItem('s4s_assessment_results') || '[]');
            
            if (results.length === 0) {
                alert('No data to export');
                return;
            }
            
            const experienceLabels = ['Entry', 'Mid', 'Senior'];
            
            // Create CSV headers
            let csv = 'Name,Email,Mobile,Experience,Score,Points,Date,Access Code\n';
            
            // Add data rows
            results.forEach(result => {
                csv += `"${result.name}","${result.email}","${result.mobile}",`;
                csv += `"${experienceLabels[result.experience]}",`;
                csv += `${result.score}%,`;
                csv += `"${result.totalScore}/${result.maxScore}",`;
                csv += `"${new Date(result.timestamp).toLocaleString()}",`;
                csv += `"${result.accessCode || ''}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Sales4Sight_Results_${new Date().getTime()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function exportToJSON() {
            const results = JSON.parse(localStorage.getItem('s4s_assessment_results') || '[]');
            
            if (results.length === 0) {
                alert('No data to export');
                return;
            }
            
            const dataStr = JSON.stringify(results, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Sales4Sight_Results_${new Date().getTime()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function clearAllData() {
            if (confirm('Are you sure you want to delete ALL assessment results? This action cannot be undone.')) {
                localStorage.removeItem('s4s_assessment_results');
                loadResults();
                alert('All assessment results have been cleared.');
            }
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
