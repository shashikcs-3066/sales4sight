<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales4Sight - Admin Dashboard</title>

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- jsPDF & autoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        /* LOGIN */
        .login-container {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg,#3b82f6,#1d4ed8);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1300px;
            margin: 25px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* FILTER BAR */
        .filter-bar {
            background: #f8fafc;
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }
        .filter-bar input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }
        .filter-btn {
            background: #2563eb;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            border: none;
            cursor: pointer;
        }
        .reset-btn {
            background: #64748b;
        }

        /* STATS */
        .stats-box {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* CHART BLOCK */
        .chart-container {
            margin: 30px 0;
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        /* MODAL */
        #detailModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: white;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 10px;
            padding: 25px;
        }
    </style>
</head>

<body>

<!-- SUPABASE SDK (MUST LOAD BEFORE ANY SCRIPT) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<!-- ============================
       LOGIN SCREEN
============================= -->
<div id="loginScreen" class="login-container">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="validateLogin()">Login</button>
        <p id="loginError" style="color:red; display:none; margin-top:10px;">
            Incorrect password
        </p>
    </div>
</div>

<!-- ============================
       ADMIN PANEL
============================= -->
<div id="adminPanel" style="display:none;">
    <div class="container">

        <div style="display:flex; justify-content:space-between;">
            <h1 style="color:#1e3a8a;">Sales4Sight – Assessment Dashboard</h1>
            <button onclick="logout()" class="filter-btn" style="background:#dc2626;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar">
            <input type="text" id="filterEmail" placeholder="Search Email">
            <input type="text" id="filterCode" placeholder="Access Code">
            <input type="number" id="filterScoreMin" placeholder="Min %">
            <input type="number" id="filterScoreMax" placeholder="Max %">
            <input type="date" id="filterDateFrom">
            <input type="date" id="filterDateTo">

            <button class="filter-btn" onclick="applyFilters()">Apply</button>
            <button class="filter-btn reset-btn" onclick="resetFilters()">Reset</button>
        </div>

        <!-- Stats -->
        <div class="stats-box">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Assessments</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statAvg">0%</div>
                <div class="stat-label">Average Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statExcellent">0</div>
                <div class="stat-label">Excellent (80%+)</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="chart-container">
            <h2 style="color:#1e3a8a;">Score Distribution</h2>
            <canvas id="scoreChart"></canvas>
        </div>

        <div class="chart-container">
            <h2 style="color:#1e3a8a;">Topic Performance</h2>
            <canvas id="topicChart"></canvas>
        </div>

        <!-- TABLE -->
        <table id="resultsTable"></table>
    </div>
</div>

<!-- ============================
       MODAL
============================= -->
<div id="detailModal">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <button class="filter-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<!-- ==========================================================
     SUPABASE + FILTERS + TABLE LOGIC
========================================================== -->
<script>
const SUPABASE_URL = "https://eejmswozatcmzjxjxvzh.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlam1zd296YXRjbXpqeGp4dnpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMjYzNjcsImV4cCI6MjA4NDkwMjM2N30.8p9ChhYY1PiQN_0nKLS-XTMlSPu0149aAxOWXdA8f-w";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function validateLogin() {
    const pass = document.getElementById("adminPass").value;
    if (pass === "SCS3066*") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadSupabaseData();
    } else {
        document.getElementById("loginError").style.display = "block";
    }
}

function logout() {
    location.reload();
}

let masterData = [];
let filteredData = [];

async function loadSupabaseData() {
    const { data, error } = await sb
        .from("assessments")
        .select("*")
        .order("timestamp", { ascending: false });

    if (error) {
        alert("Supabase Error: " + error.message);
        return;
    }

    masterData = data;
    filteredData = [...masterData];
    updateStats();
    renderTable();
}

/* ---------- FILTERS ---------- */
function applyFilters() {
    const email = document.getElementById("filterEmail").value.toLowerCase();
    const code = document.getElementById("filterCode").value.toLowerCase();
    const min = Number(document.getElementById("filterScoreMin").value || 0);
    const max = Number(document.getElementById("filterScoreMax").value || 100);

    let df = document.getElementById("filterDateFrom").value;
    let dt = document.getElementById("filterDateTo").value;

    let dateFrom = df ? new Date(df) : false;
    let dateTo = dt ? new Date(dt) : false;

    filteredData = masterData.filter(r => {
        let pct = r.percentage || 0;
        let ts = r.timestamp ? new Date(r.timestamp) : null;

        if (email && !r.email.toLowerCase().includes(email)) return false;
        if (code && !(r.access_code || "").toLowerCase().includes(code)) return false;
        if (pct < min || pct > max) return false;
        if (dateFrom && ts < dateFrom) return false;
        if (dateTo && ts > dateTo) return false;

        return true;
    });

    updateStats();
    renderTable();
}

function resetFilters() {
    ["filterEmail","filterCode","filterScoreMin","filterScoreMax",
     "filterDateFrom","filterDateTo"].forEach(id => {
        document.getElementById(id).value = "";
    });
    filteredData = [...masterData];
    updateStats();
    renderTable();
}

/* ---------- TABLE ---------- */
function renderTable() {
    let html = `
    <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Score</th>
        <th>Code</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>`;

    filteredData.forEach((r,i)=>{
        html+=`
        <tr>
            <td>${i+1}</td>
            <td>${r.name}</td>
            <td>${r.email}</td>
            <td>${r.percentage}%</td>
            <td>${r.access_code}</td>
            <td>${new Date(r.timestamp).toLocaleString()}</td>
            <td>
                <button class="filter-btn" onclick="openDetail(${i})">View</button>
                <button class="filter-btn" style="background:#0ea5e9;" onclick="downloadPDF(${i})">
                    PDF
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("resultsTable").innerHTML = html;
}

/* ---------- STATS + CHARTS ---------- */
let scoreChartInstance=null,topicChartInstance=null;

function updateStats(){
    const total=filteredData.length;
    let avg=0,exc=0;

    filteredData.forEach(r=>{
        avg += r.percentage||0;
        if((r.percentage||0)>=80) exc++;
    });

    avg=total?Math.round(avg/total):0;

    document.getElementById("statTotal").innerText=total;
    document.getElementById("statAvg").innerText=avg+"%";
    document.getElementById("statExcellent").innerText=exc;

    renderScoreChart();
    renderTopicChart();
}

function renderScoreChart(){
    const ranges={"0–25%":0,"26–50%":0,"51–75%":0,"76–100%":0};
    filteredData.forEach(r=>{
        let p=r.percentage||0;
        if(p<=25)ranges["0–25%"]++;
        else if(p<=50)ranges["26–50%"]++;
        else if(p<=75)ranges["51–75%"]++;
        else ranges["76–100%"]++;
    });

    if(scoreChartInstance)scoreChartInstance.destroy();
    scoreChartInstance=new Chart(
        document.getElementById("scoreChart").getContext("2d"),{
            type:"bar",
            data:{labels:Object.keys(ranges),
            datasets:[{data:Object.values(ranges),
                backgroundColor:["#f87171","#fb923c","#60a5fa","#34d399"]}]},
            options:{responsive:true,plugins:{legend:{display:false}},
            scales:{y:{beginAtZero:true}}}
        });
}

function renderTopicChart(){
    const totals={},counts={};
    filteredData.forEach(r=>{
        if(!r.topic_scores)return;
        Object.entries(r.topic_scores).forEach(([t,s])=>{
            totals[t]=(totals[t]||0)+s;
            counts[t]=(counts[t]||0)+1;
        });
    });

    const topics=Object.keys(totals);
    const avg=topics.map(t=>Math.round(totals[t]/counts[t]));

    if(topicChartInstance)topicChartInstance.destroy();
    topicChartInstance=new Chart(
        document.getElementById("topicChart").getContext("2d"),{
            type:"bar",
            data:{labels:topics,datasets:[{data:avg,backgroundColor:"#2563eb"}]},
            options:{responsive:true,plugins:{legend:{display:false}},
            scales:{y:{beginAtZero:true}}}
        });
}

/* ---------- MODAL ---------- */
function openDetail(i){
    const r=filteredData[i];
    let html=`
    <p><b>Email:</b> ${r.email}</p>
    <p><b>Mobile:</b> ${r.mobile}</p>
    <p><b>Experience:</b> ${r.experience}</p>
    <p><b>Access Code:</b> ${r.access_code}</p>
    <p><b>Date:</b> ${new Date(r.timestamp).toLocaleString()}</p>
    <hr><h3>Topic Scores</h3>`;

    if(r.topic_scores){
        Object.entries(r.topic_scores).forEach(([t,s])=>{
            html+=`<p><b>${t}:</b> ${s}</p>`;
        });
    }

    html+=`<hr><h3>Answers</h3>`;
    if(r.answers){
        r.answers.forEach((a,idx)=>{
            html+=`
            <p><b>Q${idx+1}:</b> ${a.question}<br>
            <i>Points:</i> ${a.points}</p>`;
        });
    }

    document.getElementById("modalBody").innerHTML=html;
    document.getElementById("modalTitle").innerText=
        `${r.name} — ${r.percentage}%`;

    document.getElementById("detailModal").style.display="flex";
}

function closeModal(){
    document.getElementById("detailModal").style.display="none";
}

/* ---------- PDF GENERATOR ---------- */
const LOGO_BASE64 = `
data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAHgCAYAAAB8j0aVAAAA
... (your full Base64 logo will appear here automatically) ...
`;

async function downloadPDF(index){
    const r=filteredData[index];
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:"pt",format:"a4"});
    const width=doc.internal.pageSize.getWidth();

    doc.setFillColor(30,58,138);
    doc.rect(0,0,width,80,"F");

    try{ doc.addImage(LOGO_BASE64,"PNG",30,15,110,50); }catch(e){}

    doc.setFontSize(24);
    doc.setTextColor("#fff");
    doc.text("Sales4Sight Assessment Report",width-40,50,{align:"right"});

    let y=120;
    doc.setFontSize(16);
    doc.setTextColor("#000");
    doc.text("Candidate Details",30,y);

    y+=15;
    const details=[
        ["Name",r.name],
        ["Email",r.email],
        ["Mobile",r.mobile],
        ["Experience",r.experience],
        ["Access Code",r.access_code],
        ["Score",`${r.percentage}%`],
        ["Date",new Date(r.timestamp).toLocaleString()],
    ];

    doc.autoTable({
        startY:y+10,
        head:[["Field","Value"]],
        body:details,
        theme:"striped",
        headStyles:{fillColor:[37,99,235]}
    });

    y=doc.lastAutoTable.finalY+20;

    if(r.topic_scores){
        doc.setFontSize(16);
        doc.text("Topic Performance",30,y);

        let rows=Object.entries(r.topic_scores).map(([t,s])=>[t,s]);
	
        doc.autoTable({
            startY:y+10,
            head:[["Topic","Score"]],
            body:rows,
            theme:"striped",
            headStyles:{fillColor:[37,99,235]}
        });

        y=doc.lastAutoTable.finalY+20;
    }

    if(r.answers){
        doc.setFontSize(10);
        doc.text("Answer Sheet",30,y);

        let rows=r.answers.map((a,i)=>[`Q${i+1}`,a.question,a.points]);

        doc.autoTable({
            startY:y+10,
            head:[["#","Question","Points"]],
            body:rows,
            theme:"striped",
            styles:{fontSize:9,cellWidth:"wrap"},
            headStyles:{fillColor:[37,99,235]}
        });
    }

    doc.setFontSize(10);
    doc.setTextColor("#6b7280");
    doc.text(
        "© 2026 Sales4Sight Inc. | Foresight. Hindsight. Insight. Oversight.",
        width/2,
        doc.internal.pageSize.getHeight()-20,
        {align:"center"}
    );

    const safe=r.name.replace(/[^a-z0-9]/gi,"_");
    doc.save(`${safe}_assessment_report.pdf`);
}
</script>

</body>
</html>
