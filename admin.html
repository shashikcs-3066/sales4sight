<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sales4Sight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f5f7fa;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #2563eb;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #1d4ed8;
        }
        
        button.secondary {
            background: #64748b;
        }
        
        button.danger {
            background: #ef4444;
        }
        
        button.success {
            background: #10b981;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: #f8fafc;
            padding: 12px 15px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            color: #475569;
            font-weight: 600;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        tr:hover {
            background: #f8fafc;
        }
        
        .score-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .score-excellent { background: #d1fae5; color: #065f46; }
        .score-good { background: #fef3c7; color: #92400e; }
        .score-poor { background: #fee2e2; color: #991b1b; }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #cbd5e1;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
        }
        
        .topic-score {
            display: inline-block;
            margin: 2px 5px;
            padding: 2px 8px;
            background: #e2e8f0;
            border-radius: 10px;
            font-size: 0.8rem;
        }
        
        .data-source-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
        
        .source-local { background: #dbeafe; color: #1e40af; }
        .source-sheets { background: #dcfce7; color: #166534; }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 9999; display: flex; align-items: center; justify-content: center;">
        <div style="text-align: center; padding: 50px 40px; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 400px; width: 90%;">
            <div style="width: 80px; height: 80px; background: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px;">
                <i class="fas fa-lock" style="font-size: 2rem; color: white;"></i>
            </div>
            <h2 style="margin-bottom: 10px; color: #2563eb;">Admin Dashboard</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Sales4Sight Assessment Results</p>
            
            <input type="password" id="admin-password" placeholder="Enter admin password" 
                   style="width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px;">
            
            <button onclick="checkPassword()" 
                    style="width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;">
                <i class="fas fa-sign-in-alt"></i> Access Dashboard
            </button>
            
            <p id="password-error" style="color: #ef4444; margin-top: 15px; display: none;">
                <i class="fas fa-exclamation-circle"></i> Incorrect password
            </p>
        </div>
    </div>

    <!-- Admin Content -->
    <div id="admin-content" style="display: none;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0;">
                <div>
                    <h1 style="color: #2563eb; margin: 0;">
                        <i class="fas fa-chart-line"></i> Assessment Results Dashboard
                    </h1>
                    <p style="color: #64748b; margin-top: 5px; font-size: 0.9rem;">
                        <i class="fas fa-database"></i> Data Sources: Local Storage & Google Sheets
                    </p>
                </div>
                <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
            
            <div class="stats" id="stats">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading statistics...</p>
                </div>
            </div>
            
            <div class="controls">
                <button onclick="loadAllResults()"><i class="fas fa-sync-alt"></i> Refresh All Data</button>
                <button onclick="loadFromLocalStorage()" class="secondary"><i class="fas fa-desktop"></i> Local Results</button>
                <button onclick="loadFromGoogleSheets()" class="success"><i class="fab fa-google"></i> Google Sheets</button>
                <button onclick="exportToCSV()" class="secondary"><i class="fas fa-download"></i> Export CSV</button>
                <button onclick="clearAllData()" class="danger"><i class="fas fa-trash"></i> Clear All</button>
            </div>
            
            <div id="data-source-info" style="background: #f0f9ff; padding: 10px 15px; border-radius: 5px; margin-bottom: 15px; display: none;">
                <i class="fas fa-info-circle" style="color: #2563eb;"></i>
                <span id="source-message">Loading data...</span>
            </div>
            
            <div id="results-table">
                <div class="empty-state">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>No Assessment Results Yet</h3>
                    <p>Select a data source to load results.</p>
                </div>
            </div>
        </div>
        
        <!-- Modal for details -->
        <div class="modal" id="detailModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Assessment Details</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <div id="modal-content"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== //
        // SECURITY SETTINGS    //
        // ==================== //
        const ADMIN_PASSWORD = "SCS3066*"; // CHANGE THIS TO YOUR PASSWORD
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID_HERE/exec"; // CHANGE THIS
        
        // Check if already logged in
        const loginTime = localStorage.getItem('admin_login_time');
        if (loginTime && (Date.now() - loginTime) < (30 * 60 * 1000)) { // 30 minutes
            showAdminContent();
        }
        
        function checkPassword() {
            const input = document.getElementById('admin-password').value;
            if (input === ADMIN_PASSWORD) {
                localStorage.setItem('admin_login_time', Date.now());
                showAdminContent();
            } else {
                document.getElementById('password-error').style.display = 'block';
                document.getElementById('admin-password').value = '';
            }
        }
        
        function showAdminContent() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadAllResults();
        }
        
        function logout() {
            localStorage.removeItem('admin_login_time');
            location.reload();
        }
        
        // Enter key support
        document.getElementById('admin-password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
        
        // Auto-logout after 30 minutes
        setInterval(() => {
            const loginTime = localStorage.getItem('admin_login_time');
            if (loginTime && (Date.now() - loginTime) > (30 * 60 * 1000)) {
                logout();
            }
        }, 60000);
        
        // ==================== //
        // DATA LOADING         //
        // ==================== //
        let currentResults = [];
        let currentSource = '';
        
        async function loadAllResults() {
            document.getElementById('results-table').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading all results...</p>
                </div>
            `;
            
            const localResults = await loadLocalStorageResults();
            const sheetsResults = await loadGoogleSheetsResults();
            
            // Combine results
            currentResults = [...localResults, ...sheetsResults];
            currentSource = 'combined';
            
            // Remove duplicates by assessment ID
            const uniqueResults = removeDuplicates(currentResults);
            
            updateDataSourceInfo(`Loaded ${uniqueResults.length} unique results from Local Storage (${localResults.length}) and Google Sheets (${sheetsResults.length})`, 'combined');
            updateStats(uniqueResults);
            updateTable(uniqueResults);
        }
        
        async function loadFromLocalStorage() {
            document.getElementById('results-table').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading local results...</p>
                </div>
            `;
            
            const results = await loadLocalStorageResults();
            currentResults = results;
            currentSource = 'local';
            
            updateDataSourceInfo(`Loaded ${results.length} results from Local Storage`, 'local');
            updateStats(results);
            updateTable(results);
        }
        
        async function loadFromGoogleSheets() {
            document.getElementById('results-table').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading Google Sheets results...</p>
                </div>
            `;
            
            const results = await loadGoogleSheetsResults();
            currentResults = results;
            currentSource = 'sheets';
            
            updateDataSourceInfo(`Loaded ${results.length} results from Google Sheets`, 'sheets');
            updateStats(results);
            updateTable(results);
        }
        
        async function loadLocalStorageResults() {
            return new Promise((resolve) => {
                const results = JSON.parse(localStorage.getItem('s4s_assessment_results') || '[]');
                // Add source info
                results.forEach(r => r._source = 'local');
                resolve(results);
            });
        }
        
        async function loadGoogleSheetsResults() {
            try {
                const response = await fetch(GOOGLE_SHEETS_URL + '?action=get');
                if (!response.ok) throw new Error('Failed to fetch');
                const results = await response.json();
                // Add source info
                results.forEach(r => r._source = 'sheets');
                return results;
            } catch (error) {
                console.error('Error loading from Google Sheets:', error);
                updateDataSourceInfo('Error loading from Google Sheets. Using local data only.', 'error');
                return [];
            }
        }
        
        function removeDuplicates(results) {
            const seen = new Set();
            return results.filter(result => {
                const id = result.assessmentId || result.id || result.timestamp + result.email;
                if (seen.has(id)) return false;
                seen.add(id);
                return true;
            });
        }
        
        function updateDataSourceInfo(message, type) {
            const infoDiv = document.getElementById('data-source-info');
            const messageSpan = document.getElementById('source-message');
            
            infoDiv.style.display = 'block';
            messageSpan.textContent = message;
            
            // Set color based on type
            infoDiv.style.background = type === 'combined' ? '#f0f9ff' : 
                                     type === 'local' ? '#fef3c7' : 
                                     type === 'sheets' ? '#d1fae5' : 
                                     '#fee2e2';
            infoDiv.style.borderLeft = `4px solid ${type === 'combined' ? '#2563eb' : 
                                                     type === 'local' ? '#f59e0b' : 
                                                     type === 'sheets' ? '#10b981' : 
                                                     '#ef4444'}`;
        }
        
        function updateStats(results) {
            const statsDiv = document.getElementById('stats');
            
            if (results.length === 0) {
                statsDiv.innerHTML = '<div class="empty-state">No data available</div>';
                return;
            }
            
            const total = results.length;
            const avgScore = Math.round(results.reduce((sum, r) => {
                const score = typeof r.score === 'string' ? parseFloat(r.score.replace('%', '')) : r.score;
                return sum + (score || 0);
            }, 0) / results.length);
            
            const excellent = results.filter(r => {
                const score = typeof r.score === 'string' ? parseFloat(r.score.replace('%', '')) : r.score;
                return score >= 80;
            }).length;
            
            const good = results.filter(r => {
                const score = typeof r.score === 'string' ? parseFloat(r.score.replace('%', '')) : r.score;
                return score >= 60 && score < 80;
            }).length;
            
            const poor = results.filter(r => {
                const score = typeof r.score === 'string' ? parseFloat(r.score.replace('%', '')) : r.score;
                return score < 60;
            }).length;
            
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${total}</div>
                    <div class="stat-label">Total Assessments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${avgScore}%</div>
                    <div class="stat-label">Average Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${excellent}</div>
                    <div class="stat-label">Excellent (80%+)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${good}</div>
                    <div class="stat-label">Good (60-79%)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${poor}</div>
                    <div class="stat-label">Needs Improvement</div>
                </div>
            `;
        }
        
        function updateTable(results) {
            const tableDiv = document.getElementById('results-table');
            
            if (results.length === 0) {
                tableDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>No Results Found</h3>
                        <p>Try loading from a different data source.</p>
                    </div>
                `;
                return;
            }
            
            // Sort by most recent first
            results.sort((a, b) => {
                const dateA = new Date(a.timestamp || a.Timestamp || 0);
                const dateB = new Date(b.timestamp || b.Timestamp || 0);
                return dateB - dateA;
            });
            
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Experience</th>
                            <th>Score</th>
                            <th>Date</th>
                            <th>Source</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            results.forEach((result, index) => {
                const name = result.name || result.Name || 'Unknown';
                const email = result.email || result.Email || 'No email';
                const experience = result.experience || result.Experience || 'Not specified';
                const score = result.score || result.Score || '0%';
                const date = result.timestamp || result.Timestamp || 'Unknown date';
                const source = result._source || 'unknown';
                
                const scoreValue = typeof score === 'string' ? parseFloat(score.replace('%', '')) : score;
                const scoreClass = scoreValue >= 80 ? 'score-excellent' : 
                                 scoreValue >= 60 ? 'score-good' : 'score-poor';
                
                const sourceClass = source === 'local' ? 'source-local' : 'source-sheets';
                const sourceIcon = source === 'local' ? 'fa-desktop' : 'fa-google';
                
                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${name}</td>
                        <td>${email}</td>
                        <td>${experience}</td>
                        <td>
                            <span class="score-badge ${scoreClass}">
                                ${score}${typeof score === 'number' ? '%' : ''}
                            </span>
                        </td>
                        <td>${new Date(date).toLocaleDateString()}</td>
                        <td>
                            <span class="data-source-badge ${sourceClass}">
                                <i class="fas ${sourceIcon}"></i> ${source}
                            </span>
                        </td>
                        <td>
                            <button onclick="viewDetails(${index})" style="padding: 5px 10px; font-size: 0.9rem;">
                                <i class="fas fa-eye"></i> View
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tableHTML += '</tbody></table>';
            tableDiv.innerHTML = tableHTML;
        }
        
        function viewDetails(index) {
            const result = currentResults[index];
            if (!result) return;
            
            const name = result.name || result.Name || 'Unknown';
            const email = result.email || result.Email || 'No email';
            const mobile = result.mobile || result.Mobile || 'No mobile';
            const experience = result.experience || result.Experience || 'Not specified';
            const score = result.score || result.Score || '0%';
            const points = result.points || result.Points || '0/0';
            const date = result.timestamp || result.Timestamp || 'Unknown date';
            const accessCode = result.accessCode || result['Access Code'] || 'No code';
            const topics = result.topics || result.Topics || '{}';
            
            let topicsHTML = '';
            try {
                const topicsObj = typeof topics === 'string' ? JSON.parse(topics) : topics;
                Object.entries(topicsObj).forEach(([topic, data]) => {
                    if (data && typeof data === 'object' && data.percentage !== undefined) {
                        const statusClass = data.percentage >= 80 ? 'score-excellent' : 
                                          data.percentage >= 60 ? 'score-good' : 'score-poor';
                        topicsHTML += `
                            <div style="margin-bottom: 8px;">
                                <strong>${topic}:</strong>
                                <span class="score-badge ${statusClass}" style="margin-left: 10px;">
                                    ${data.percentage}%
                                </span>
                                (${data.totalPoints || 0}/${data.maxPoints || 0} points)
                            </div>
                        `;
                    }
                });
            } catch (e) {
                topicsHTML = `<p>Topic data not available in standard format</p>`;
            }
            
            document.getElementById('modal-title').textContent = `Assessment: ${name}`;
            document.getElementById('modal-content').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <h3>Candidate Information</h3>
                    <p><strong>Name:</strong> ${name}</p>
                    <p><strong>Email:</strong> ${email}</p>
                    <p><strong>Mobile:</strong> ${mobile}</p>
                    <p><strong>Experience Level:</strong> ${experience}</p>
                    <p><strong>Access Code:</strong> ${accessCode}</p>
                    <p><strong>Assessment Date:</strong> ${new Date(date).toLocaleString()}</p>
                    <p><strong>Data Source:</strong> ${result._source || 'unknown'}</p>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3>Performance Summary</h3>
                    <p><strong>Overall Score:</strong> ${score}${typeof score === 'number' ? '%' : ''}</p>
                    <p><strong>Points:</strong> ${points}</p>
                </div>
                
                ${topicsHTML ? `
                <div style="margin-bottom: 20px;">
                    <h3>Topic-wise Performance</h3>
                    ${topicsHTML}
                </div>
                ` : ''}
                
                <div style="margin-top: 20px;">
                    <button onclick="downloadIndividualReport(${index})">
                        <i class="fas fa-download"></i> Download Report
                    </button>
                </div>
            `;
            
            document.getElementById('detailModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }
        
        function downloadIndividualReport(index) {
            const result = currentResults[index];
            if (!result) return;
            
            const name = result.name || result.Name || 'Unknown';
            const email = result.email || result.Email || 'No email';
            const mobile = result.mobile || result.Mobile || 'No mobile';
            const experience = result.experience || result.Experience || 'Not specified';
            const score = result.score || result.Score || '0%';
            const points = result.points || result.Points || '0/0';
            const date = result.timestamp || result.Timestamp || 'Unknown date';
            const accessCode = result.accessCode || result['Access Code'] || 'No code';
            
            let report = `SALES4SIGHT ASSESSMENT REPORT - ADMIN VIEW\n`;
            report += `============================================\n\n`;
            report += `Candidate Information:\n`;
            report += `- Name: ${name}\n`;
            report += `- Email: ${email}\n`;
            report += `- Mobile: ${mobile}\n`;
            report += `- Experience Level: ${experience}\n`;
            report += `- Access Code: ${accessCode}\n`;
            report += `- Assessment Date: ${new Date(date).toLocaleString()}\n`;
            report += `- Data Source: ${result._source || 'unknown'}\n\n`;
            
            report += `Performance Summary:\n`;
            report += `- Overall Score: ${score}${typeof score === 'number' ? '%' : ''}\n`;
            report += `- Points: ${points}\n\n`;
            
            const blob = new Blob([report], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Sales4Sight_Report_${name.replace(/\s+/g, '_')}_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function exportToCSV() {
            if (currentResults.length === 0) {
                alert('No data to export');
                return;
            }
            
            // Create CSV headers
            let csv = 'Name,Email,Mobile,Experience,Score,Points,Date,Access Code,Data Source\n';
            
            // Add data rows
            currentResults.forEach(result => {
                const name = result.name || result.Name || 'Unknown';
                const email = result.email || result.Email || 'No email';
                const mobile = result.mobile || result.Mobile || 'No mobile';
                const experience = result.experience || result.Experience || 'Not specified';
                const score = result.score || result.Score || '0%';
                const points = result.points || result.Points || '0/0';
                const date = result.timestamp || result.Timestamp || 'Unknown date';
                const accessCode = result.accessCode || result['Access Code'] || 'No code';
                const source = result._source || 'unknown';
                
                csv += `"${name}","${email}","${mobile}",`;
                csv += `"${experience}",`;
                csv += `"${score}",`;
                csv += `"${points}",`;
                csv += `"${new Date(date).toLocaleString()}",`;
                csv += `"${accessCode}",`;
                csv += `"${source}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Sales4Sight_Results_${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function clearAllData() {
            if (confirm('Are you sure you want to delete ALL assessment results from Local Storage? This will not affect Google Sheets data.')) {
                localStorage.removeItem('s4s_assessment_results');
                loadAllResults();
                alert('Local Storage data cleared. Google Sheets data remains intact.');
            }
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
