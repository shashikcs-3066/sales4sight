<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales4Sight - Admin Dashboard</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 0;
        }
        .login-container {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg,#3b82f6,#1d4ed8);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-top: 12px;
        }
        .login-box button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h1 {
            margin: 0 0 20px 0;
            color: #1e3a8a;
        }

        /* Stats */
        .stats-box {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            flex: 1;
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .stat-value {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }
        .stat-label {
            font-size: 14px;
            color: #64748b;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th {
            background: #f1f5f9;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        tr:hover {
            background: #f9fafb;
        }
        button.action-btn {
            padding: 6px 12px;
            background: #2563eb;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Modal */
        #detailModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: white;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 10px;
            padding: 25px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>

<!-- ============================
       LOGIN SCREEN
============================= -->
<div id="loginScreen" class="login-container">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="validateLogin()">Login</button>
        <p id="loginError" style="color:red; display:none; margin-top:10px;">Incorrect password</p>
    </div>
</div>

<!-- ============================
       ADMIN PANEL
============================= -->
<div id="adminPanel" style="display:none;">
    <div class="container">
        <div style="display:flex; justify-content:space-between;">
            <h1>Assessment Dashboard</h1>
            <button onclick="logout()" class="action-btn" style="background:#dc2626;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-box">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Assessments</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statAvg">0%</div>
                <div class="stat-label">Average Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statExcellent">0</div>
                <div class="stat-label">Excellent (80%+)</div>
            </div>
        </div>

        <!-- Actions -->
        <button class="action-btn" onclick="exportCSV()">
            <i class="fas fa-file-csv"></i> Export CSV
        </button>
        <button class="action-btn" onclick="exportJSON()">
            <i class="fas fa-file-export"></i> Export JSON
        </button>
        <button class="action-btn" onclick="loadSupabaseData()" style="background:#0ea5e9;">
            <i class="fas fa-cloud-download-alt"></i> Refresh Data
        </button>

        <!-- Results Table -->
        <table id="resultsTable"></table>

    </div>
</div>

<!-- ============================
       DETAILS MODAL
============================= -->
<div id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle"></h3>
            <button onclick="closeModal()" style="background:none; border:none; font-size:22px;">×</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<!-- ============================
       SUPABASE SDK
============================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
// =====================================
// SUPABASE CONFIG
// =====================================
const SUPABASE_URL = "https://eejmswozatcmzjxjxvzh.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlam1zd296YXRjbXpqeGp4dnpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMjYzNjcsImV4cCI6MjA4NDkwMjM2N30.8p9ChhYY1PiQN_0nKLS-XTMlSPu0149aAxOWXdA8f-w";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =====================================
// ADMIN LOGIN SYSTEM
// =====================================
function validateLogin() {
    const pass = document.getElementById("adminPass").value;
    if (pass === "SCS3066*") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadSupabaseData();
    } else {
        document.getElementById("loginError").style.display = "block";
    }
}

function logout() {
    location.reload();
}

// =====================================
// LOAD DATA FROM SUPABASE (FIXED)
// =====================================
let latestData = [];

async function loadSupabaseData() {
    document.getElementById("resultsTable").innerHTML = "<tr><td>Loading...</td></tr>";

    const { data, error } = await sb
        .from("assessments")
        .select("*")
        .order("timestamp", { ascending: false });   // FIXED

    if (error) {
        alert("Error loading Supabase data: " + error.message);
        return;
    }

    latestData = data;

    updateStats();
    renderTable();
}

// =====================================
// UPDATE DASHBOARD STATS
// =====================================
function updateStats() {
    const total = latestData.length;

    let avg = 0;
    let excellent = 0;

    latestData.forEach(r => {
        const pct = r.percentage || 0;
        avg += pct;
        if (pct >= 80) excellent++;
    });

    avg = total ? Math.round(avg / total) : 0;

    document.getElementById("statTotal").innerText = total;
    document.getElementById("statAvg").innerText = avg + "%";
    document.getElementById("statExcellent").innerText = excellent;
}

// =====================================
// RENDER TABLE
// =====================================
function renderTable() {
    let html = `
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Score</th>
            <th>Access Code</th>
            <th>Date</th>
            <th>View</th>
        </tr>
    `;

    latestData.forEach((r, i) => {
        html += `
        <tr>
            <td>${i+1}</td>
            <td>${r.name}</td>
            <td>${r.email}</td>
            <td>${r.percentage || 0}%</td>
            <td>${r.access_code || "-"}</td>
            <td>${new Date(r.timestamp).toLocaleString()}</td>   <!-- FIXED -->
            <td><button class="action-btn" onclick="openDetail(${i})">View</button></td>
        </tr>
        `;
    });

    document.getElementById("resultsTable").innerHTML = html;
}

// =====================================
// OPEN DETAILS MODAL
// =====================================
function openDetail(i) {
    const r = latestData[i];

    document.getElementById("modalTitle").innerText =
        `${r.name} — ${r.percentage}%`;

    let html = `
        <p><strong>Email:</strong> ${r.email}</p>
        <p><strong>Mobile:</strong> ${r.mobile}</p>
        <p><strong>Experience:</strong> ${r.experience}</p>
        <p><strong>Access Code:</strong> ${r.access_code}</p>
        <p><strong>Date:</strong> ${new Date(r.timestamp).toLocaleString()}</p>  <!-- FIXED -->
        <hr><h3>Topic Scores</h3>
    `;

    if (r.topic_scores) {
        Object.entries(r.topic_scores).forEach(([topic, score]) => {
            html += `<p><strong>${topic}:</strong> ${score}</p>`;
        });
    }

    html += `<hr><h3>Answers</h3>`;

    if (r.answers) {
        r.answers.forEach((a, idx) => {
            html += `
                <p>
                    <strong>Q${idx+1}:</strong> ${a.question}<br>
                    <em>Points:</em> ${a.points}
                </p>`;
        });
    }

    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("detailModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("detailModal").style.display = "none";
}

// =====================================
// EXPORT CSV
// =====================================
function exportCSV() {
    if (!latestData.length) return alert("No data to export.");

    let csv = "Name,Email,Score,Access Code,Date\n";

    latestData.forEach(r => {
        csv += `"${r.name}","${r.email}","${r.percentage}%","${r.access_code}","${r.timestamp}"\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "assessments.csv";
    link.click();
}

// =====================================
// EXPORT JSON
// =====================================
function exportJSON() {
    const blob = new Blob([JSON.stringify(latestData, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "assessments.json";
    link.click();
}

</script>

</body>
</html>
